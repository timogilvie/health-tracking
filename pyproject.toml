[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "health-tracking"
version = "0.1.0"
description = "Local-first longitudinal personal health data platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tim Ogilvie" }]
dependencies = [
  "duckdb>=1.4,<2",
  "httpx>=0.28,<1",
  "oura-ring==1.0.1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pytz>=2025.2",
  "pyyaml>=6,<7",
  "typer>=0.16,<1",
]

[project.urls]
Repository = "https://github.com/timogilvie/health-tracking"
Issues = "https://github.com/timogilvie/health-tracking/issues"

[project.scripts]
health = "health.cli:app"

[dependency-groups]
dev = [
  "cyclonedx-bom>=7.3.1",
  "pip-audit>=2.10.1",
  "pip-licenses>=5.5.5",
  "pytest>=8.4,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/health"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
branch = true
source = ["health"]

[tool.coverage.report]
show_missing = true
skip_covered = true
