name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.7.2"
      - name: Install Python and locked dependencies
        run: uv sync --locked --python 3.12
      - name: Check formatting and lint
        run: uv run ruff check .
      - name: Validate OSS provenance policy
        run: uv run health policy-check
      - name: Run tests
        run: uv run pytest --cov=health --cov-report=term-missing
