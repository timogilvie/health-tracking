name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.7.2"
      - name: Install Python and locked dependencies
        run: uv sync --locked --python 3.12
      - name: Check formatting and lint
        run: uv run ruff check .
      - name: Validate OSS provenance policy
        run: uv run health policy-check
      - name: Reject tracked secrets and personal health data
        run: uv run health privacy-check
      - name: Inventory dependency licenses
        run: >-
          uv run pip-licenses --from=all --format=json --with-urls
          --with-license-file --no-license-path --partial-match
          --fail-on='GNU General Public License;GNU Affero General Public License;SSPL'
          --output-file=/tmp/third-party-licenses.json
      - name: Generate reproducible CycloneDX SBOM
        run: >-
          uv run cyclonedx-py environment .venv --pyproject pyproject.toml
          --output-reproducible --of JSON -o /tmp/health-tracking.cdx.json
      - name: Upload dependency evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dependency-evidence
          path: |
            /tmp/third-party-licenses.json
            /tmp/health-tracking.cdx.json
      - name: Audit locked dependencies for vulnerabilities
        run: |
          uv export --quiet --locked --format requirements.txt --no-dev \
            --no-emit-project --output-file /tmp/health-runtime-requirements.txt
          uv run pip-audit --requirement /tmp/health-runtime-requirements.txt \
            --require-hashes --disable-pip --strict --progress-spinner=off
      - name: Run tests
        run: uv run pytest --cov=health --cov-report=term-missing
      - name: Prove offline fixture rebuild and exports
        run: bash scripts/clean-clone-smoke.sh
